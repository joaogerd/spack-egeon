packages:
  gcc:
    externals:
    - spec: gcc@12.3.0
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-12
          cxx: /usr/bin/g++-12
          fortran: /usr/bin/gfortran-12

  all:
    providers:
      blas: [netlib-lapack, blis]
      lapack: [netlib-lapack, blis]
      zlib-api: [zlib]

  openblas:
    buildable: false

