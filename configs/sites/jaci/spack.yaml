spack:
  specs:
  - gcc@12.3.0
  - blis %gcc
  - bison
  - boost
  - ecbuild
  - eckit
  - ecmwf-atlas+tesselation
  - eigen
  - ectrans
  - esmf
  - fckit
  - fftw +mpi +openmp
  - flex
  - flexiblas
  - git-lfs
  - gptl
  - gsl-lite
  - hdf5 +mpi +fortran +hl
  - jedi-cmake
  - jedi-mpas-env
  - llvm-openmp
  - metis
  - nccmp
  - netcdf-c +mpi ^hdf5+mpi+hl
  - netcdf-fortran ^netcdf-c+mpi ^hdf5+mpi+hl
  - netcdf-cxx4 ^netcdf-c+mpi ^hdf5+mpi+hl
  - nlohmann-json
  - nlohmann-json-schema-validator
  - openblas %gcc@12.3.0
  - openblas
  - openmpi
  - parallel-netcdf
  - parallelio +pnetcdf
  - python
  - py-pycodestyle
  - qhull
  - udunits
  - wget
  - zlib
  - lmod
  - scorpio
  view: true

  concretizer:
    unify: true

  packages:
    gcc:
      externals: []
    cce:
      externals: []
    all:
      providers:
        blas: [netlib-lapack, blis]
        lapack: [netlib-lapack, blis]
        zlib-api: [zlib]
    openblas:
      buildable: true
    fortran:
      prefer: [gcc@12.3.0]

  config:
    install_tree:
      root: /lustre/projetos/monan_das/rodrigo.braz/spack-install
    build_jobs: 8
    modules:
      enable: [lmod]
      lmod:
        core_compilers: [gcc@7.5.0]  # Alterado para evitar conflito com o GCC 12
        hash_length: 0
        projections:
          all: '{name}/{version}'

  modules:
    default:
      lmod:
        core_compilers:
        - gcc@7.5.0  # Alterado para evitar loop infinito no Lmod

